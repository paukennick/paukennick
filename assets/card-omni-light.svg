<svg xmlns="http://www.w3.org/2000/svg" width="400" height="236" viewBox="0 0 400 236" role="img" aria-label="OmniEngineering: Repo-local engineering workspace that keeps AI assistants on one context.">
<defs>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#D97706"/><stop offset="1" stop-color="#EA580C"/></linearGradient>
  <clipPath id="frame"><rect width="400" height="236" rx="14"/></clipPath>
</defs>
<g clip-path="url(#frame)"><rect width="400" height="236" fill="#FFFFFF"/><rect width="400" height="4" fill="url(#edge)"/></g>
<rect x=".5" y=".5" width="399" height="235" rx="14" fill="none" stroke="#E7E5E4"/>
<text x="24" y="38" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1" fill="#D97706">FORK · CONTRIBUTOR</text>
<text x="24" y="76" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#1C1917">OmniEngineering</text>
<text x="24" y="108" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#57534E">Repo-local engineering workspace that</text><text x="24" y="130" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#57534E">keeps AI assistants on one context.</text>
<line x1="24" x2="376" y1="152" y2="152" stroke="#E7E5E4"/>
<text x="24" y="188" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#D97706">5</text><text x="24" y="210" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#57534E">AI assistants</text><text x="150" y="188" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#D97706">3.10+</text><text x="150" y="210" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#57534E">Python</text><text x="276" y="188" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#D97706">0</text><text x="276" y="210" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#57534E">MCP servers needed</text>
<svg x="322" y="18" width="56" height="56" viewBox="0 0 256 256"><defs><radialGradient id="omni-r" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#2A2118"/><stop offset="1" stop-color="#141414"/></radialGradient></defs><rect width="256" height="256" rx="56" fill="url(#omni-r)"/><g transform="translate(36 36) scale(4)">  <!-- Panel frame (the workspace) -->
  <rect x="3" y="3" width="32" height="38" rx="3" fill="none" stroke="#e0475c" stroke-width="1.5"/>
  <!-- Corner nodes -->
  <circle cx="3" cy="3" r="1.5" fill="#e0475c"/>
  <circle cx="35" cy="3" r="1.5" fill="#e0475c"/>
  <circle cx="3" cy="41" r="1.5" fill="#e0475c"/>
  <circle cx="35" cy="41" r="1.5" fill="#e0475c"/>
  <!-- One control plane, fanned out to many assistant adapters -->
  <line x1="19" y1="20" x2="10" y2="10" stroke="#e0475c" stroke-width="1" opacity="0.55"/>
  <line x1="19" y1="20" x2="28" y2="9"  stroke="#e0475c" stroke-width="1" opacity="0.45"/>
  <line x1="19" y1="20" x2="9"  y2="27" stroke="#e0475c" stroke-width="1" opacity="0.35"/>
  <line x1="19" y1="20" x2="29" y2="28" stroke="#e0475c" stroke-width="1" opacity="0.5"/>
  <line x1="19" y1="20" x2="19" y2="34" stroke="#e0475c" stroke-width="1" opacity="0.3"/>
  <circle cx="10" cy="10" r="1.4" fill="#e0475c" opacity="0.8"/>
  <circle cx="28" cy="9"  r="1.4" fill="#e0475c" opacity="0.7"/>
  <circle cx="9"  cy="27" r="1.4" fill="#e0475c" opacity="0.6"/>
  <circle cx="29" cy="28" r="1.4" fill="#e0475c" opacity="0.75"/>
  <circle cx="19" cy="34" r="1.4" fill="#e0475c" opacity="0.55"/>
  <!-- Hub -->
  <circle cx="19" cy="20" r="7" fill="none" stroke="#e0475c" stroke-width="0.75" opacity="0.3"/>
  <circle cx="19" cy="20" r="3.5" fill="#e0475c" opacity="0.9"/>
  <!-- Beacon — overlaps bottom-right corner -->
  <circle cx="41" cy="41" r="7" fill="#e0475c"/>
  <circle cx="41" cy="41" r="3" fill="#0f0f12"/></g></svg>
</svg>
